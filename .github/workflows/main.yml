name: Production Release & Verification (MAIN)

on:
  push:
    branches:
      - main

jobs:
  production-build-and-verify:
    name: Build & Verify Production Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Strict Production Verification
        run: |
          npm run typecheck
          npm run lint

      - name: Build Application (Production)
        run: npm run build

      - name: Archive Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-artifact
          path: .output
          retention-days: 90
